name: CI
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '.gitignore'
      - '**.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
      - '.github/workflows/manual.yml'

  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '.gitignore'
      - '**.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
      - '.github/workflows/manual.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'master' }}

jobs:

  perf-run:
    # This will cause the job being skipped on PRs originating from the main repository
    # which is OK, because in that case the regular `push` trigger will run the workflow
    if: ${{ github.head_ref == '' && github.repository == 'jajik/mod_proxy_cluster-perf-comparison' }}
    name: ${{ contains(matrix.os, 'arm') && 'ARM' || 'x86' }} (${{ matrix.tomcat_count }} tomcats${{ matrix.disable && format(', {0} disable', matrix.disable) || '' }}${{ matrix.shutdown && format(', {0} shutdown', matrix.shutdown) || '' }}${{ matrix.stop && format(', {0} stop', matrix.stop) || '' }}${{ matrix.kill && format(', {0} kill', matrix.kill) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tomcat_count: 10
            os: ubuntu-latest

          - tomcat_count: 25
            os: ubuntu-latest

          - tomcat_count: 50
            os: ubuntu-latest

          - tomcat_count: 10
            shutdown: 2
            disable: 2
            stop: 2
            os: ubuntu-latest

          - tomcat_count: 10
            shutdown: 1
            disable: 2
            kill: 1 # kill is quite destructive, so the results will be (more) variable
            stop: 2
            os: ubuntu-latest

          - tomcat_count: 25
            shutdown: 2
            disable: 3
            stop: 3
            os: ubuntu-latest

          - tomcat_count: 25
            shutdown: 2
            disable: 8
            stop: 8
            os: ubuntu-latest

          - tomcat_count: 50
            shutdown: 10
            disable: 10
            kill: 5 # kill is quite destructive, so the results will be (more) variable
            stop: 10
            os: ubuntu-latest

          - tomcat_count: 50
            shutdown: 10
            disable: 10
            stop: 10
            os: ubuntu-latest

          - tomcat_count: 50
            shutdown: 10
            disable: 10
            stop: 10
            os: ubuntu-24.04-arm

    env:
      TOMCAT_COUNT:      ${{ matrix.tomcat_count }}
      SHUTDOWN_RANDOMLY: ${{ matrix.shutdown || 0 }}
      DISABLE_RANDOMLY:  ${{ matrix.disable  || 0 }}
      STOP_RANDOMLY:     ${{ matrix.stop || 0 }}
      KILL_RANDOMLY:     ${{ matrix.kill || 0 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Set the httpd logging level
        run: |
          if [ ${{ matrix.tomcat_count }} -le 30 ]; then echo "HTTPD_LOG_LEVEL=debug" >> $GITHUB_ENV; fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Get dependencies and remove unused packages
        run: |
          sudo apt-get update -y
          sudo apt-get install gcc maven git curl iproute2 wcstools g++ cmake liblist-moreutils-perl
          sudo rm -rf /usr/local/.ghcup /usr/local/lib/android /usr/share/swift /opt/microsoft/msedge/ /opt/google/chrome/
      - name: Setup  performance tests
        run: |
          sh setup.sh
          # create a directory on a filesystem with more space
          sudo mkdir /mnt/output
          sudo chmod 777 /mnt/output
          ln -s /mnt/output output
      - name: Run performance tests
        run: sh run-suite.sh 2>&1 | tee output/run-suite.logs
      - name: Make a summary of test runs
        run: |
          perl summary.pl output/ | tee summary
          cp summary output/summary-for-${{ contains(matrix.os, 'arm') && 'ARM' || 'x86' }}-${{ matrix.tomcat_count }}-tomcats${{ matrix.disable && format('-{0}-disable', matrix.disable) || '' }}${{ matrix.shutdown && format('-{0}-shutdown', matrix.shutdown) || '' }}${{ matrix.stop && format('-{0}-stop', matrix.stop) || '' }}${{ matrix.kill && format('-{0}-kill', matrix.kill) || '' }}
          # preserve environment variables as well
          printenv > output/envvars
      - name: Check Status 200
        run: |
          if [ $(grep -c "Status 200" summary) -eq 0 ]; then exit 1; fi
      - name: Preserve output
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Output-for-${{ contains(matrix.os, 'arm') && 'ARM' || 'x86' }}-${{ matrix.tomcat_count }}-tomcats${{ matrix.disable && format('-{0}-disable', matrix.disable) || '' }}${{ matrix.shutdown && format('-{0}-shutdown', matrix.shutdown) || '' }}${{ matrix.stop && format('-{0}-stop', matrix.stop) || '' }}${{ matrix.kill && format('-{0}-kill', matrix.kill) || '' }}
          path: output/*

